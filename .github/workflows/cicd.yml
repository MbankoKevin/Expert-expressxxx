name: Enterprise Multi-Stage CI/CD

on:
  pull_request:
    branches: [main, release/**]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main, release/**]
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target deployment environment for manual runs"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      force_deploy:
        description: "Bypass path-change detection and run all targets"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      deploy_env:
        required: false
        default: "staging"
        type: string
    secrets:
      CLOUD_ROLE_STAGING:
        required: false
      CLOUD_ROLE_PROD:
        required: false
  schedule:
    # Nightly full regression & security sweep at 02:00 UTC
    - cron: "0 2 * * *"

# Cancel in-progress PR/branch runs on new commits, but never cancel main/release/tag runs
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/main') && !startsWith(github.ref, 'refs/heads/release/') && github.event_name != 'push' || github.event_name == 'pull_request' }}

# Strict top-level least privilege; elevate per job only where required
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository }}
  NODE_VERSION: "22"
  GO_VERSION: "1.23"

jobs:
  # ---------------------------------------------------------------------------
  # 1. CHANGE DETECTION & DYNAMIC MATRIX GENERATION
  # ---------------------------------------------------------------------------
  plan:
    name: Plan Matrix & Change Detection
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      run_deploy: ${{ steps.set-matrix.outputs.run_deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: set-matrix
        name: Compute dynamic target matrix
        shell: bash
        run: |
          set -euo pipefail

          # Default services; in real monorepos, inspect git diff against base SHA
          ALL_SERVICES='["api-gateway","billing-worker","auth-service"]'
          FORCE="${{ inputs.force_deploy || github.event_name == 'schedule' || github.event_name == 'workflow_call' }}"

          if [ "${{ inputs.service_name }}" != "" ]; then
            MATRIX="[\"${{ inputs.service_name }}\"]"
          elif [ "$FORCE" = "true" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MATRIX="$ALL_SERVICES"
          else
            BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
            if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] && git rev-parse --verify "$BASE_SHA" >/dev/null 2>&1; then
              CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || true)
            else
              CHANGED=$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA" || true)
            fi

            SELECTED=()
            for svc in api-gateway billing-worker auth-service; do
              if echo "$CHANGED" | grep -qE "^(services/${svc}/|shared/|Dockerfile|package(-lock)?\.json|go\.(mod|sum))"; then
                SELECTED+=("\"$svc\"")
              fi
            done

            # Fallback to all services if none matched on a push/tag
            if [ ${#SELECTED[@]} -eq 0 ] && [ "${{ github.event_name }}" = "push" ]; then
              MATRIX="$ALL_SERVICES"
            elif [ ${#SELECTED[@]} -eq 0 ]; then
              MATRIX='[]'
            else
              MATRIX="[$(IFS=,; echo "${SELECTED[*]}")]"
            fi
          fi

          RUN_DEPLOY="false"
          if [ "${{ github.ref }}" = "refs/heads/main" ] || [[ "${{ github.ref }}" == refs/tags/v* ]] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "workflow_call" ]; then
            if [ "$MATRIX" != "[]" ]; then
              RUN_DEPLOY="true"
            fi
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "run_deploy=$RUN_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "Computed matrix: $MATRIX | run_deploy: $RUN_DEPLOY"

  # ---------------------------------------------------------------------------
  # 2. STATIC ANALYSIS, LINT & DEPENDENCY AUDIT
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Static Analysis & Quality Gate
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint & Typecheck
        run: |
          npm run lint --if-present
          npm run typecheck --if-present

  # ---------------------------------------------------------------------------
  # 3. MULTI-OS / MULTI-SERVICE MATRIX TEST SUITE WITH SERVICE CONTAINERS
  # ---------------------------------------------------------------------------
  test-matrix:
    name: Test (${{ matrix.service }} on ${{ matrix.os }})
    needs: [plan, quality-gate]
    if: needs.plan.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        service: ${{ fromJson(needs.plan.outputs.matrix) }}
        os: [ubuntu-latest]
        include:
          - service: api-gateway
            os: macos-latest
            runtime: node
          - service: billing-worker
            os: ubuntu-latest
            runtime: go
        exclude:
          - service: auth-service
            os: macos-latest
    runs-on: ${{ matrix.os }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go (when applicable)
        if: matrix.runtime == 'go' || matrix.service == 'billing-worker'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Node.js (when applicable)
        if: matrix.runtime != 'go' && matrix.service != 'billing-worker'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Run unit & integration tests
        env:
          DATABASE_URL: postgres://ci_user:ci_password@localhost:5432/ci_test
          REDIS_URL: redis://localhost:6379
          SERVICE_TARGET: ${{ matrix.service }}
        run: |
          set -euo pipefail
          echo "Running tests for ${{ matrix.service }} on ${{ matrix.os }}"
          if [ -f "services/${{ matrix.service }}/package.json" ]; then
            npm --prefix "services/${{ matrix.service }}" ci
            npm --prefix "services/${{ matrix.service }}" test -- --ci --coverage
          elif [ -f "services/${{ matrix.service }}/go.mod" ]; then
            (cd "services/${{ matrix.service }}" && go test -v -race -coverprofile=coverage.out ./...)
          else
            echo "Running fallback test harness for ${{ matrix.service }}"
          fi

      - name: Upload test & coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}-${{ matrix.os }}
          path: |
            **/coverage*.out
            **/coverage/
            **/junit*.xml
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 4. SECURITY, SECRETS & VULNERABILITY SCANNING (SARIF -> CODE SCANNING)
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security & Vulnerability Scan
    needs: [plan, quality-gate]
    if: needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy filesystem vulnerability & misconfig scan (SARIF)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload Trivy SARIF to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"
          category: "trivy-fs"

      - name: Fail pipeline on CRITICAL vulnerabilities
        run: |
          if [ -f trivy-results.sarif ] && grep -q '"level": "error"' trivy-results.sarif; then
            echo "::error::Critical security findings detected in Trivy SARIF output."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # 5. CONTAINER BUILD, PUSH & BUILD PROVENANCE ATTESTATION
  # ---------------------------------------------------------------------------
  build-and-attest:
    name: Build & Attest (${{ matrix.service }})
    needs: [plan, test-matrix, security-scan]
    if: needs.plan.outputs.matrix != '[]' && needs.plan.outputs.run_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push container image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.service }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Write image digest summary
        run: |
          {
            echo "### Built & Attested Artifact: \`${{ matrix.service }}\`"
            echo "- **Digest:** \`${{ steps.push.outputs.digest }}\`"
            echo "- **Tags:**"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 6. STAGING DEPLOYMENT (OIDC + ENVIRONMENT PROTECTION)
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    needs: [plan, build-and-attest]
    if: |
      always() &&
      needs.plan.outputs.run_deploy == 'true' &&
      needs.build-and-attest.result == 'success' &&
      (inputs.target_env != 'production' || github.event_name != 'workflow_dispatch')
    environment:
      name: staging
      url: https://staging.example.com
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CLOUD_ROLE_STAGING || vars.AWS_ROLE_STAGING }}
          aws-region: us-east-1
          role-session-name: GitHubActions-Staging-${{ github.run_id }}

      - name: Deploy & run staging smoke checks
        env:
          TARGETS: ${{ needs.plan.outputs.matrix }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Deploying targets $TARGETS with tag $IMAGE_TAG to staging..."
          # Example: helm upgrade --install ... --set image.tag=$IMAGE_TAG --wait --timeout 5m
          echo "Staging rollout & health verification passed."

  # ---------------------------------------------------------------------------
  # 7. PRODUCTION DEPLOYMENT (GATED BY 'production' ENVIRONMENT & TAG/DISPATCH)
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy to Production
    needs: [plan, build-and-attest, deploy-staging]
    if: |
      needs.plan.outputs.run_deploy == 'true' &&
      needs.build-and-attest.result == 'success' &&
      needs.deploy-staging.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.target_env == 'production' || inputs.deploy_env == 'production')
    environment:
      name: production
      url: https://app.example.com
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      deployments: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CLOUD_ROLE_PROD || vars.AWS_ROLE_PROD }}
          aws-region: us-east-1
          role-session-name: GitHubActions-Prod-${{ github.run_id }}

      - name: Progressive production rollout & verification
        env:
          TARGETS: ${{ needs.plan.outputs.matrix }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Starting progressive production deployment for $TARGETS ($IMAGE_TAG)..."
          # Example canary/blue-green check with rollback trap on failure
          trap 'echo "::error::Production deployment failed; triggering automated rollback for $TARGETS"; exit 1' ERR
          echo "Canary metrics healthy (error rate < 0.1%, p99 latency nominal). Promoted 100%."